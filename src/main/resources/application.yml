spring:
  application:
    name: api-gateway

  security:
    oauth2:

      client:
        registration:
          keycloak:
            client-id: api-gateway
            client-secret: ${KEYCLOAK_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email

        provider:
          keycloak:
            issuer-uri: http://localhost:8180/realms/file-converter

      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/file-converter

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: flow-manager
              uri: lb://flow-manager
              predicates:
                - Path=/api/v1/files/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/