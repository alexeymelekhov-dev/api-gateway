spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: flow-manager
              uri: lb://flow-manager
              predicates:
                - Path=api/v1/files/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/